name: Prepare SSH changes
on:
  push:
    branches: [starcom-ssh]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: starcom-ssh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and lock the implementation
        run: |
          cargo fmt
          cargo generate-lockfile
          git add Cargo.lock src tests
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Apply rustfmt and generated SSH dependency lockfile'
            git push origin HEAD:starcom-ssh
          fi
          cargo fmt --check
          cargo test --locked --all-targets
