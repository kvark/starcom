name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Create the release once, with the notes, before any job races to upload an
  # asset into it. The matrix below only attaches files.
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract this tag's section from CHANGELOG.md
        run: |
          awk -v want="## ${GITHUB_REF_NAME}" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # An empty body means the tag has no changelog entry. Say so here
          # rather than publishing a release with nothing in it.
          test -s notes.md
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: Starcom ${{ github.ref_name }}
          body_path: notes.md

  release:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      # --- Linux ---
      - name: Install packaging tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # cargo-bundle shells out to mksquashfs to build the AppImage.
          sudo apt-get update
          sudo apt-get install -y squashfs-tools
          cargo install cargo-bundle --git https://github.com/burtonageo/cargo-bundle --rev 17cc8eb --locked
          cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build + bundle (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo bundle --release --bin starcom

      - name: Package tarball (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          tar -C target/release -czf dist/starcom-linux-x86_64.tar.gz starcom

      - name: Package AppImage (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cp target/release/bundle/appimage/starcom_*_x86_64.AppImage dist/starcom-linux-x86_64.AppImage

      - name: Package deb + rpm (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo deb --no-build
          cp target/debian/*.deb dist/
          cargo generate-rpm
          cp target/generate-rpm/*.rpm dist/

      # --- macOS ---
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cargo install cargo-bundle --git https://github.com/burtonageo/cargo-bundle --rev 17cc8eb --locked
          rustup target add aarch64-apple-darwin
          cargo bundle --release --target aarch64-apple-darwin --bin starcom

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist
          APP=target/aarch64-apple-darwin/release/bundle/osx/Starcom.app
          codesign --sign - --force --deep "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/starcom-macos-aarch64.zip
          mkdir -p dmg_staging
          cp -R "$APP" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname Starcom -srcfolder dmg_staging -ov -format UDZO dist/starcom-macos-aarch64.dmg

      # --- Windows ---
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: cargo build --release --locked --bin starcom

      - name: Package zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/starcom.exe -DestinationPath dist/starcom-windows-x86_64.zip

      # --- Upload ---
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
