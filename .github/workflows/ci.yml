name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux SSH dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config openssh-server tmux
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Core without SSH
        run: cargo test --locked --no-default-features --all-targets
      - name: Isolated Linux SSH and tmux integration
        if: runner.os == 'Linux'
        run: scripts/test-ssh.sh

  desktop-development-inputs:
    # Temporary recovery/export; never publishes application code or credentials.
    # Removed once the recovered desktop and transport pass validation.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Recover uploaded source objects and resolve Rust-native SSH candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export BUNDLE="$RUNNER_TEMP/recovery"
          mkdir -p "$BUNDLE/source" "$BUNDLE/original"
          git archive HEAD | tar -x -C "$BUNDLE/original"
          python3 - <<'PY'
          import base64, concurrent.futures, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path(os.environ['BUNDLE'])
          api = 'https://api.github.com/repos/kvark/starcom/git/'
          def get(path):
              req = urllib.request.Request(api + path, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          tree = get('trees/536c3ae32ae13f0a52d1df98d8168e9277cc55b1?recursive=1')
          assert not tree['truncated']
          (root / 'recovered-tree.json').write_text(json.dumps(tree, indent=2))
          def save(entry):
              if entry['type'] != 'blob':
                  return
              rel = pathlib.PurePosixPath(entry['path'])
              assert not rel.is_absolute() and '..' not in rel.parts
              blob = get('blobs/' + entry['sha'])
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == entry['sha']
              out = root / 'source' / rel
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
              out.chmod(0o755 if entry['mode'] == '100755' else 0o644)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              list(pool.map(save, tree['tree']))
          p = root / 'source' / 'Cargo.toml'
          s = p.read_text()
          s = s.replace('ssh2 = { version = "0.9.6", optional = true }', 'sunset = { version = "=0.6.0", default-features = false, features = ["std", "openssh-key", "rsa", "ecdsa256"], optional = true }\nssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "rsa", "p256", "encryption"], optional = true }\nhmac = { version = "0.13", optional = true }\nsha1 = { version = "0.11", optional = true }\nzeroize = { version = "1", optional = true }')
          start = s.index('# Use OpenSSL on Windows')
          end = s.index('[features]', start)
          s = s[:start] + s[end:]
          s = s.replace('ssh = ["dep:ssh2", "dep:polling", "dep:base64"]', 'ssh = ["dep:sunset", "dep:ssh-key", "dep:hmac", "dep:sha1", "dep:zeroize", "dep:polling", "dep:base64"]')
          s = s.replace('vendored-openssl = ["ssh", "ssh2/vendored-openssl"]\n', '')
          p.write_text(s)
          PY
          cargo vendor --versioned-dirs --manifest-path "$BUNDLE/source/Cargo.toml" "$BUNDLE/vendor" > "$BUNDLE/vendor-config.toml"
          cargo tree --manifest-path "$BUNDLE/source/Cargo.toml" --all-features > "$BUNDLE/dependencies.txt"
          tar -C "$BUNDLE" -czf "$RUNNER_TEMP/starcom-recovery.tar.gz" source original recovered-tree.json vendor vendor-config.toml dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: starcom-recovered-source
          path: ${{ runner.temp }}/starcom-recovery.tar.gz
          compression-level: 0
          retention-days: 7
      - name: Export portable Rust toolchain and isolated test executables
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server tmux
          SYSROOT=$(rustc --print sysroot)
          mkdir -p "$RUNNER_TEMP/toolchain" "$RUNNER_TEMP/fixture/bin" "$RUNNER_TEMP/fixture/lib"
          for entry in bin lib libexec; do
            if test -d "$SYSROOT/$entry"; then cp -a "$SYSROOT/$entry" "$RUNNER_TEMP/toolchain/"; fi
          done
          test -x "$RUNNER_TEMP/toolchain/bin/rustc"
          for name in tmux ssh ssh-keygen ssh-agent ssh-add sshd; do
            exe=$(command -v "$name" || echo /usr/sbin/sshd)
            cp "$exe" "$RUNNER_TEMP/fixture/bin/$name"
            ldd "$exe" | awk '$2 == "=>" {print $3}' | while read -r lib; do cp -L "$lib" "$RUNNER_TEMP/fixture/lib/"; done
          done
          if test -f /usr/lib/openssh/sshd-session; then cp /usr/lib/openssh/sshd-session "$RUNNER_TEMP/fixture/bin/"; fi
          rustc --version > "$RUNNER_TEMP/toolchain/VERSION"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/starcom-toolchain.tar.gz" toolchain fixture
      - uses: actions/upload-artifact@v4
        with:
          name: starcom-offline-toolchain
          path: ${{ runner.temp }}/starcom-toolchain.tar.gz
          compression-level: 0
          retention-days: 1
