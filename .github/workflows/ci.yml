name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux SSH dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config openssh-server tmux
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Format check
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Core without SSH
        run: cargo test --locked --no-default-features --all-targets
      - name: Isolated Linux SSH and tmux integration
        if: runner.os == 'Linux'
        run: scripts/test-ssh.sh

  # One-time cleanup requested by the maintainer. Remove this job after it runs.
  cleanup-legacy-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only the preserved legacy branch tips
        shell: bash
        run: |
          set -euo pipefail
          for entry in \
            starcom-foundation:ab5853894360729f7767d5508ed1d76529bb08e0 \
            starcom-live:6239e8eed57962ec569e266696a120b2b1429611; do
            branch=${entry%%:*}
            expected=${entry#*:}
            actual=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
            if [ -z "$actual" ]; then
              echo "$branch is already absent"
              continue
            fi
            if [ "$actual" != "$expected" ]; then
              echo "Refusing to delete $branch: its tip changed" >&2
              exit 1
            fi
            git merge-base --is-ancestor "$actual" HEAD
            git push --force-with-lease="refs/heads/$branch:$expected" \
              origin ":refs/heads/$branch"
          done
