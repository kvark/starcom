name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux SSH dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config openssh-server tmux
      - name: macOS OpenSSL
        if: runner.os == 'macOS'
        run: echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Core without SSH
        run: cargo test --no-default-features --all-targets
      - name: Isolated Linux SSH and tmux integration
        if: runner.os == 'Linux'
        run: scripts/test-ssh.sh
      - name: Format check
        run: cargo fmt --check
      - name: Preserve validation material
        if: always()
        shell: bash
        run: |
          cargo fmt
          git diff -- src tests > formatting.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            Cargo.lock
            formatting.patch
            src/
            tests/
            scripts/
